<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IndiCure Rider</title>
<style>
  :root{
    --bg:#F8FAFC; --card:#FFFFFF; --text:#172033; --muted:#64748B;
    --blue:#0D9488; --blue-light:#F0FDFA; --border:#E5E7EB;
    --success:#16A34A; --warning:#F59E0B; --error:#DC2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .hidden{display:none !important}
  .topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .topbar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
  .brand{font-weight:800;color:var(--blue);font-size:18px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .badge{background:var(--text);color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:.02em}
  .grow{flex:1}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:600}
  button.ok{background:var(--success)} button.ghost{background:transparent;color:var(--muted);font-weight:500}
  button.small{padding:8px 12px;font-size:13px;border-radius:8px}
  button:disabled{opacity:.5;cursor:not-allowed}
  input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .wrap{max-width:620px;margin:0 auto;padding:18px 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px;margin-top:12px}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.assigned{background:#FEF3C7;color:#92400E}
  .pill.out_for_delivery{background:#DBEAFE;color:#1e40af}
  .pill.delivered{background:#DCFCE7;color:var(--success)}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:100%;max-width:360px}
  .toast{position:fixed;right:16px;bottom:16px;max-width:360px;padding:12px 16px;border-radius:10px;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:14px;z-index:50}
  .toast.err{background:var(--error)} .toast.ok{background:var(--success)}
  .leg{display:flex;gap:8px;align-items:flex-start;padding:8px 0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}
  h1{font-size:19px;margin:0}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="card login-card">
    <div class="brand"><svg viewBox="0 0 512 512" width="30" height="30" style="vertical-align:middle"><rect x="18" y="18" width="476" height="476" rx="120" fill="#fff" stroke="#0f172a" stroke-width="30"/><path d="M256 128 C196 128 148 174 148 232 C148 318 256 420 256 420 C256 420 364 318 364 232 C364 174 316 128 256 128 Z" fill="#fff" stroke="#10b981" stroke-width="26"/><rect x="238" y="176" width="36" height="112" rx="12" fill="#10b981"/><rect x="206" y="208" width="100" height="36" rx="12" fill="#10b981"/></svg> <span style="white-space:nowrap"><span style="color:#0f172a">Indi</span><span style="color:#10b981">Cure</span></span> <span class="badge">RIDER</span></div>
    <p class="muted" style="margin:10px 0 14px">Delivery partner — sign in</p>
    <label>Email</label><input id="email" type="email" placeholder="you@rider.test" />
    <label>Password</label><input id="password" type="password" placeholder="your password" />
    <button id="loginBtn" style="width:100%;margin-top:14px">Sign in</button>
    <p class="muted" style="font-size:12px;margin-top:10px">Ask your admin to create your rider account.</p>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="topbar"><div class="topbar-in">
    <span class="brand"><svg viewBox="0 0 512 512" width="30" height="30" style="vertical-align:middle"><rect x="18" y="18" width="476" height="476" rx="120" fill="#fff" stroke="#0f172a" stroke-width="30"/><path d="M256 128 C196 128 148 174 148 232 C148 318 256 420 256 420 C256 420 364 318 364 232 C364 174 316 128 256 128 Z" fill="#fff" stroke="#10b981" stroke-width="26"/><rect x="238" y="176" width="36" height="112" rx="12" fill="#10b981"/><rect x="206" y="208" width="100" height="36" rx="12" fill="#10b981"/></svg> <span style="white-space:nowrap"><span style="color:#0f172a">Indi</span><span style="color:#10b981">Cure</span></span> <span class="badge">RIDER</span></span>
    <span class="grow"></span>
    <span id="whoami" class="muted"></span>
    <button class="ghost" id="acctBtn">Account</button>
    <button class="ghost" id="logoutBtn">Log out</button>
  </div></div>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1>My deliveries</h1>
      <button class="small" style="background:var(--blue-light);color:var(--blue)" id="refreshBtn">Refresh</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const $=(id)=>document.getElementById(id);
let token=localStorage.getItem('rider_token')||'';
let refreshTimer=null;
function riderPoll(){ if(document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return; load(); }
function startAutoRefresh(){ if(refreshTimer) clearInterval(refreshTimer); refreshTimer=setInterval(()=>{ if(document.hidden) return; riderPoll(); }, 10000); }
function stopAutoRefresh(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && token) riderPoll(); });
function toast(m,ok=false){const t=document.createElement('div');t.className='toast '+(ok?'ok':'err');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
async function refreshAccess(){
  const rt=localStorage.getItem('rider_refresh'); if(!rt) return false;
  try{
    const r=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:rt})});
    if(!r.ok) return false;
    const d=await r.json();
    token=d.accessToken; localStorage.setItem('rider_token',token);
    if(d.refreshToken) localStorage.setItem('rider_refresh',d.refreshToken);
    return true;
  }catch{ return false; }
}
async function api(path,opts={}){
  const send=()=>fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(opts.headers||{})}});
  let r=await send();
  if(r.status===401 && token && await refreshAccess()) r=await send();
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401 && token){ token=''; try{localStorage.removeItem('rider_token');localStorage.removeItem('rider_refresh');}catch{} if(typeof stopAutoRefresh==='function')stopAutoRefresh(); const av=document.getElementById('appView'),lv=document.getElementById('loginView'); if(av)av.classList.add('hidden'); if(lv)lv.classList.remove('hidden'); }
    throw new Error(d?.error?.message||('Failed ('+r.status+')'));
  }
  return d;
}

async function login(){
  try{
    $('loginBtn').disabled=true;
    const email=$('email').value.trim();
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password:$('password').value})});
    if(d.needs2FA){ $('loginBtn').disabled=false; return acctShow2FA(d.email||email, async(r)=>{ if(r.user.role!=='rider'){ toast('This is not a rider account'); return; } token=r.accessToken; localStorage.setItem('rider_token',token); if(r.refreshToken) localStorage.setItem('rider_refresh',r.refreshToken); await showApp(); }); }
    if(d.user.role!=='rider'){ toast('This is not a rider account'); $('loginBtn').disabled=false; return; }
    token=d.accessToken; localStorage.setItem('rider_token',token); if(d.refreshToken) localStorage.setItem('rider_refresh',d.refreshToken); await showApp();
  }catch(e){ toast(e.message); } finally{ $('loginBtn').disabled=false; }
}
function logout(){ stopAutoRefresh(); token=''; try{localStorage.removeItem('rider_token');localStorage.removeItem('rider_refresh');}catch{} $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); }

async function showApp(){
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  try{ const me=await api('/api/auth/me'); if(me.user.role!=='rider') return logout(); $('whoami').textContent=me.user.name; }
  catch{ return logout(); }
  await load();
  startAutoRefresh();
}

async function load(){
  $('list').innerHTML='<p class="muted">Loading…</p>';
  try{
    const d=await api('/api/rider/orders'); const items=d.items||[];
    const active=items.filter(o=>o.status==='assigned'||o.status==='out_for_delivery');
    const done=items.filter(o=>o.status==='delivered');
    if(!active.length && !done.length){ $('list').innerHTML='<div class="card muted">No deliveries assigned yet.</div>'; return; }
    $('list').innerHTML='';
    for(const o of active) $('list').appendChild(card(o));
    if(done.length){ const h=document.createElement('p'); h.className='muted'; h.style.marginTop='18px'; h.textContent='Completed'; $('list').appendChild(h); for(const o of done) $('list').appendChild(card(o)); }
  }catch(e){ toast(e.message); $('list').innerHTML=''; }
}

function card(o){
  const ph=o.pharmacy||{}, cust=o.customer||{}, a=o.deliveryAddress||{}, pa=ph.address||{};
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>${o.orderNumber}</strong><span class="pill ${o.status}">${o.status.replace(/_/g,' ')}</span>
    </div>
    <div class="leg"><div class="dot" style="background:var(--warning)"></div><div><strong>Pick up from</strong><div>${ph.name||''}</div><div class="muted" style="font-size:13px">${[pa.line1,pa.city,pa.pincode].filter(Boolean).join(', ')} ${ph.phone?('· '+ph.phone):''}</div></div></div>
    <div class="leg"><div class="dot" style="background:var(--success)"></div><div><strong>Deliver to</strong><div>${cust.name||'Customer'} ${cust.phone?('· '+cust.phone):''}</div><div class="muted" style="font-size:13px">${[a.line1,a.city,a.pincode].filter(Boolean).join(', ')}${a.instructions?(' — '+a.instructions):''}</div></div></div>
    <div class="muted" style="font-size:13px;margin:6px 0 2px">${(o.items&&o.items[0]?o.items[0].name+' × '+o.items[0].quantity:'')} · ₹${o.total}</div>
    <div class="act" style="margin-top:10px"></div>`;
  const act=c.querySelector('.act');
  if(o.status==='assigned'){
    const b=document.createElement('button'); b.className='ok'; b.style.width='100%'; b.textContent='Confirm pickup';
    b.onclick=async()=>{ try{ await api('/api/rider/orders/'+o._id+'/pickup',{method:'POST'}); toast('Picked up — out for delivery',true); load(); }catch(e){ toast(e.message);} };
    act.appendChild(b);
  } else if(o.status==='out_for_delivery'){
    act.innerHTML=`<label>How did the customer pay?</label>
      <div style="display:flex;gap:8px;margin:4px 0 12px">
        <button type="button" class="paybtn" data-pay="cash" style="flex:1;padding:9px;border-radius:8px;cursor:pointer">💵 Cash</button>
        <button type="button" class="paybtn" data-pay="upi" style="flex:1;padding:9px;border-radius:8px;cursor:pointer">📲 UPI / Scan</button>
      </div>
      <label>Enter delivery OTP (ask the customer)</label>
      <div style="display:flex;gap:8px"><input class="otp" maxlength="6" placeholder="6-digit OTP" /><button class="ok dl">Deliver</button></div>`;
    let pay='cash';
    const paint=()=>act.querySelectorAll('.paybtn').forEach(b=>{ const on=b.dataset.pay===pay; b.style.background=on?'#0d9488':'#fff'; b.style.color=on?'#fff':'#0f172a'; b.style.border='1px solid '+(on?'#0d9488':'#cbd5e1'); });
    act.querySelectorAll('.paybtn').forEach(btn=>{ btn.onclick=()=>{ pay=btn.dataset.pay; paint(); }; });
    paint();
    const inp=act.querySelector('.otp'); inp.addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
    act.querySelector('.dl').onclick=async()=>{ const otp=inp.value.trim(); if(otp.length!==6) return toast('Enter the 6-digit OTP');
      try{ await api('/api/rider/orders/'+o._id+'/deliver',{method:'POST',body:JSON.stringify({otp,collectedVia:pay})}); toast('Delivered! 🎉',true); load(); }catch(e){ toast(e.message);} };
  } else {
    act.innerHTML='<span class="muted" style="font-size:13px">Completed</span>';
  }
  return c;
}

$('loginBtn').addEventListener('click',login);
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
/* ===================== ACCOUNT SETTINGS (shared) ===================== */
function acctEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function acctEnsureModal(){
  if(document.getElementById('acctModal')) return;
  const st=document.createElement('style');
  st.textContent='#acctModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:9999;padding:24px 14px;overflow:auto}#acctModal.open{display:flex}#acctCard{background:#fff;width:100%;max-width:440px;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}#acctCard h3{margin:0 0 4px}.acct-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #eef0f3;cursor:pointer}.acct-row:first-of-type{border-top:0}.acct-row .ic{font-size:20px}.acct-row .sp{flex:1}.acct-row .sp strong{display:block}.acct-row .sp .sub{font-size:12px;color:#7a828c;margin-top:2px}.acct-row .chev{color:#b4bbc4;font-size:20px}#acctCard input{width:100%;padding:11px 12px;border:1px solid #d7dce2;border-radius:10px;margin:6px 0;font-size:15px;box-sizing:border-box}#acctCard label{font-size:12px;color:#6b7280;font-weight:600}.acct-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acct-btns button{padding:10px 14px;border-radius:10px;border:0;font-weight:600;cursor:pointer}.acct-primary{background:#0f9d8f;color:#fff}.acct-ghost{background:#f1f3f5;color:#333}.acct-danger{background:#fde8e8;color:#c0392b}.acct-sub{font-size:13px;color:#6b7280;line-height:1.5}';
  document.head.appendChild(st);
  const m=document.createElement('div'); m.id='acctModal'; m.innerHTML='<div id="acctCard"></div>';
  m.addEventListener('click',e=>{ if(e.target===m) acctClose(); });
  document.body.appendChild(m);
}
function acctOpen(html){ acctEnsureModal(); document.getElementById('acctCard').innerHTML=html; document.getElementById('acctModal').classList.add('open'); }
function acctClose(){ const m=document.getElementById('acctModal'); if(m) m.classList.remove('open'); }
let _acctMe=null;
async function openAccount(){
  acctOpen('<p class="acct-sub">Loading…</p>');
  try{ const me=await api('/api/auth/me'); _acctMe=me.user; acctHome(); }
  catch(e){ acctOpen('<p class="acct-sub">'+acctEsc(e.message)+'</p><div class="acct-btns"><button class="acct-ghost" onclick="acctClose()">Close</button></div>'); }
}
function acctRowH(ic,label,sub,onclick){
  return '<div class="acct-row" onclick="'+onclick+'"><div class="ic">'+ic+'</div><div class="sp"><strong>'+acctEsc(label)+'</strong><div class="sub">'+acctEsc(sub)+'</div></div><div class="chev">›</div></div>';
}
function acctHome(){
  const u=_acctMe||{}; const tfa=u.twoFactorEnabled;
  acctOpen(
    '<h3>Account</h3><p class="acct-sub" style="margin:0 0 6px">'+acctEsc(u.name||'')+(u.email?' · '+acctEsc(u.email):'')+'</p>'+
    acctRowH('✏️','Edit profile','Name and mobile number','acctEditProfile()')+
    acctRowH('🔒','Change password','Get a code by email to set a new password','acctChangePw()')+
    acctRowH('🛡️','Two-step verification',tfa?'On — we email a code each time you sign in':'Off — add an extra code at login','acct2fa()')+
    acctRowH('📱','Manage devices','See where you\'re signed in and log out others','acctDevices()')+
    '<div class="acct-btns"><button class="acct-ghost" onclick="acctClose()">Close</button></div>'
  );
}
function acctEditProfile(){
  const u=_acctMe||{};
  acctOpen('<h3>Edit profile</h3><label>Full name</label><input id="apName" value="'+acctEsc(u.name||'')+'"/><label>Mobile</label><input id="apPhone" maxlength="10" value="'+acctEsc(u.phone||'')+'" placeholder="10-digit mobile"/><label>Email</label><input value="'+acctEsc(u.email||'')+'" disabled style="opacity:.6"/><div class="acct-sub">Email can\'t be changed here.</div><div class="acct-btns"><button class="acct-primary" id="apSave">Save</button><button class="acct-ghost" onclick="acctHome()">Back</button></div>');
  document.getElementById('apPhone').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
  document.getElementById('apSave').onclick=async()=>{
    const name=document.getElementById('apName').value.trim(), phone=document.getElementById('apPhone').value.trim();
    if(name.length<2){ toast('Please enter your name'); return; }
    if(phone && phone.length!==10){ toast('Enter a valid 10-digit mobile'); return; }
    const b=document.getElementById('apSave'); b.disabled=true; b.textContent='Saving…';
    try{ const d=await api('/api/account/profile',{method:'PATCH',body:JSON.stringify({name,phone})}); _acctMe=d.user; try{var w=document.getElementById('whoami'); if(w) w.textContent=d.user.name;}catch(_){} toast('Profile updated',true); acctHome(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Save'; }
  };
}
function acctChangePw(){
  const u=_acctMe||{}; const email=u.email||'';
  if(!email){ acctOpen('<h3>Change password</h3><p class="acct-sub">This account has no email, so a reset code can\'t be sent.</p><div class="acct-btns"><button class="acct-ghost" onclick="acctHome()">Back</button></div>'); return; }
  acctOpen('<h3>Change password</h3><p class="acct-sub">We\'ll email a 6-digit code to <strong>'+acctEsc(email)+'</strong> to confirm it\'s you.</p><div class="acct-btns"><button class="acct-primary" id="cpSend">Send code</button><button class="acct-ghost" onclick="acctHome()">Back</button></div>');
  document.getElementById('cpSend').onclick=async()=>{
    const b=document.getElementById('cpSend'); b.disabled=true; b.textContent='Sending…';
    try{ await api('/api/auth/forgot-password',{method:'POST',body:JSON.stringify({email})}); acctChangePw2(email); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Send code'; }
  };
}
function acctChangePw2(email){
  acctOpen('<h3>Change password</h3><p class="acct-sub">Enter the code sent to <strong>'+acctEsc(email)+'</strong> and your new password.</p><label>Code</label><input id="cpCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="off"/><label>New password</label><input id="cpPass" type="password" placeholder="at least 8 characters" autocomplete="new-password"/><div class="acct-btns"><button class="acct-primary" id="cpSave">Change password</button><button class="acct-ghost" onclick="acctHome()">Cancel</button></div>');
  document.getElementById('cpCode').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
  document.getElementById('cpSave').onclick=async()=>{
    const code=document.getElementById('cpCode').value.trim(), password=document.getElementById('cpPass').value;
    if(code.length!==6){ toast('Enter the 6-digit code'); return; }
    if(password.length<8){ toast('Password must be at least 8 characters'); return; }
    const b=document.getElementById('cpSave'); b.disabled=true; b.textContent='Saving…';
    try{ await api('/api/auth/reset-password',{method:'POST',body:JSON.stringify({email,code,password})}); toast('Password changed',true); acctHome(); }
    catch(e){ toast(e.message); b.disabled=false; b.textContent='Change password'; }
  };
}
function acct2fa(){
  const u=_acctMe||{}; const on=!!u.twoFactorEnabled; const email=u.email||'';
  if(on){
    acctOpen('<h3>Two-step verification</h3><p class="acct-sub">It\'s <strong style="color:#0f9d8f">On</strong>. Every sign-in needs a code emailed to <strong>'+acctEsc(email)+'</strong>.</p><div class="acct-btns"><button class="acct-danger" id="tfOff">Turn off</button><button class="acct-ghost" onclick="acctHome()">Back</button></div>');
    document.getElementById('tfOff').onclick=async()=>{ if(!confirm('Turn off two-step verification? Anyone with your password will be able to sign in.')) return; const b=document.getElementById('tfOff'); b.disabled=true; try{ await api('/api/account/2fa/disable',{method:'POST'}); _acctMe.twoFactorEnabled=false; toast('Turned off',true); acctHome(); }catch(e){ toast(e.message); b.disabled=false; } };
    return;
  }
  if(!email){ acctOpen('<h3>Two-step verification</h3><p class="acct-sub">Add an email to this account first.</p><div class="acct-btns"><button class="acct-ghost" onclick="acctHome()">Back</button></div>'); return; }
  acctOpen('<h3>Two-step verification</h3><p class="acct-sub">When on, every sign-in needs a 6-digit code emailed to <strong>'+acctEsc(email)+'</strong>. We\'ll send one now to confirm.</p><div class="acct-btns"><button class="acct-primary" id="tfSend">Send code</button><button class="acct-ghost" onclick="acctHome()">Back</button></div>');
  document.getElementById('tfSend').onclick=async()=>{ const b=document.getElementById('tfSend'); b.disabled=true; b.textContent='Sending…'; try{ await api('/api/account/2fa/send-code',{method:'POST'}); acct2fa2(email); }catch(e){ toast(e.message); b.disabled=false; b.textContent='Send code'; } };
}
function acct2fa2(email){
  acctOpen('<h3>Two-step verification</h3><p class="acct-sub">Enter the code sent to <strong>'+acctEsc(email)+'</strong> to turn it on.</p><input id="tfCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="off" style="text-align:center;letter-spacing:4px;font-size:18px"/><div class="acct-btns"><button class="acct-primary" id="tfOn">Turn on</button><button class="acct-ghost" onclick="acctHome()">Cancel</button></div>');
  document.getElementById('tfCode').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
  document.getElementById('tfOn').onclick=async()=>{ const code=document.getElementById('tfCode').value.trim(); if(code.length!==6){ toast('Enter the 6-digit code'); return; } const b=document.getElementById('tfOn'); b.disabled=true; b.textContent='Turning on…'; try{ await api('/api/account/2fa/enable',{method:'POST',body:JSON.stringify({code})}); _acctMe.twoFactorEnabled=true; toast('Two-step verification on',true); acctHome(); }catch(e){ toast(e.message); b.disabled=false; b.textContent='Turn on'; } };
}
function acctDevAgo(t){ if(!t) return ''; const s=Math.floor((Date.now()-new Date(t).getTime())/1000); if(s<60)return 'just now'; const m=Math.floor(s/60); if(m<60)return m+' min ago'; const h=Math.floor(m/60); if(h<24)return h+(h===1?' hr ago':' hrs ago'); const d=Math.floor(h/24); return d+(d===1?' day ago':' days ago'); }
function acctDevices(){
  acctOpen('<h3>Manage devices</h3><p class="acct-sub">Devices and browsers signed in to your account. Log out any you don\'t recognise.</p><div id="acctDevList"><p class="acct-sub">Loading…</p></div><div class="acct-btns"><button class="acct-ghost" onclick="acctHome()">Back</button></div>');
  acctLoadDevices();
}
async function acctLoadDevices(){
  const box=document.getElementById('acctDevList'); if(!box) return;
  try{
    const d=await api('/api/account/sessions'); const items=d.items||[];
    if(!items.length){ box.innerHTML='<p class="acct-sub">No active devices yet. Other devices appear here shortly after they\'re next used.</p>'; return; }
    box.innerHTML='';
    items.forEach(s=>{
      const row=document.createElement('div'); row.className='acct-row'; row.style.cursor='default';
      const icon=(s.device&&s.device.indexOf('mobile')>=0)?'📱':'💻';
      row.innerHTML='<div class="ic">'+icon+'</div><div class="sp"><strong>'+acctEsc(s.device||'Device')+'</strong><div class="sub">'+(s.current?'This device · ':'')+'Active '+acctEsc(acctDevAgo(s.lastSeenAt))+'</div></div>';
      if(s.current){ const sp=document.createElement('span'); sp.className='sub'; sp.style.cssText='color:#0f9d8f;font-weight:700'; sp.textContent='● This device'; row.appendChild(sp); }
      else { const b=document.createElement('button'); b.className='acct-ghost'; b.style.cssText='padding:7px 10px;border-radius:8px'; b.textContent='Log out'; b.onclick=async()=>{ if(!confirm('Log out this device?')) return; try{ await api('/api/account/sessions/'+s.id,{method:'DELETE'}); toast('Device logged out',true); acctLoadDevices(); }catch(e){ toast(e.message); } }; row.appendChild(b); }
      box.appendChild(row);
    });
    if(items.filter(x=>!x.current).length){ const all=document.createElement('button'); all.className='acct-danger'; all.style.cssText='margin-top:12px;padding:9px 12px;border-radius:9px'; all.textContent='Log out all other devices'; all.onclick=async()=>{ if(!confirm('Log out all other devices?')) return; try{ await api('/api/account/sessions/others',{method:'DELETE'}); toast('Other devices logged out',true); acctLoadDevices(); }catch(e){ toast(e.message); } }; box.appendChild(all); }
  }catch(e){ box.innerHTML='<p class="acct-sub">'+acctEsc(e.message)+'</p>'; }
}
function acctShow2FA(email,onSuccess){
  acctOpen('<h3>Two-step verification</h3><p class="acct-sub">This account has two-step verification on. Enter the 6-digit code emailed to <strong>'+acctEsc(email)+'</strong> to finish signing in.</p><input id="l2Code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="off" style="text-align:center;letter-spacing:4px;font-size:18px"/><div class="acct-btns"><button class="acct-primary" id="l2Btn">Verify & sign in</button><button class="acct-ghost" onclick="acctClose()">Cancel</button></div>');
  document.getElementById('l2Code').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
  const run=async()=>{ const code=document.getElementById('l2Code').value.trim(); if(code.length!==6){ toast('Enter the 6-digit code'); return; } const b=document.getElementById('l2Btn'); b.disabled=true; b.textContent='Verifying…'; try{ const r=await api('/api/auth/verify-2fa',{method:'POST',body:JSON.stringify({email,code})}); acctClose(); await onSuccess(r); }catch(e){ toast(e.message); b.disabled=false; b.textContent='Verify & sign in'; } };
  document.getElementById('l2Btn').onclick=run;
  document.getElementById('l2Code').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
}
/* =================== END ACCOUNT SETTINGS =================== */
$('logoutBtn').addEventListener('click',logout);
$('acctBtn').addEventListener('click',openAccount);
$('refreshBtn').addEventListener('click',load);
if(token){ showApp().catch(()=>logout()); }
