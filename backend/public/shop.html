<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pharmacy Marketplace</title>
<style>
  :root{
    --bg:#F8FAFC; --card:#FFFFFF; --text:#172033; --muted:#64748B;
    --blue:#0D9488; --blue-dark:#0F766E; --blue-light:#F0FDFA; --border:#E5E7EB;
    --success:#16A34A; --warning:#F59E0B; --error:#DC2626;
    --shadow:0 1px 2px rgba(16,24,40,.05); --shadow-lg:0 8px 24px rgba(16,24,40,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .hidden{display:none !important}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:var(--blue);color:#fff;font-weight:600}
  button:hover{background:var(--blue-dark)}
  button.ghost{background:transparent;color:var(--blue);font-weight:600;padding:8px 10px}
  button.ghost:hover{background:var(--blue-light)}
  button.light{background:var(--blue-light);color:var(--blue)}
  button.small{padding:8px 12px;font-size:13px}
  button.ok{background:var(--success)} button.ok:hover{filter:brightness(.95)}
  button:disabled{opacity:.5;cursor:not-allowed}
  input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
  .topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
  .brand{font-weight:800;color:var(--blue);font-size:18px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .searchbox{flex:1;display:flex;max-width:620px;position:relative}
  .searchbox input{border-radius:10px;padding-left:40px}
  .searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .navbtns{display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto}
  .cartbtn{position:relative}
  .cartbtn .count,.notifbtn .count{position:absolute;top:-6px;right:-6px;background:var(--error);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .notif-wrap{position:relative}
  .notifbtn{position:relative;font-size:17px}
  .notif-panel{position:absolute;top:44px;right:0;width:330px;max-width:86vw;max-height:66vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:40;padding:6px}
  .notif-item{padding:10px;border-radius:8px;border-bottom:1px solid var(--border)}
  .notif-item:last-child{border-bottom:none}

  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
  h1{font-size:22px;margin:0 0 2px} h2{font-size:17px;margin:22px 0 10px}
  .muted{color:var(--muted)} .sub{color:var(--muted);font-size:14px}
  .row{display:flex;gap:10px;align-items:center}
  .sp{flex:1}

  .hero{background:linear-gradient(120deg,var(--blue),#2DD4BF);color:#fff;border-radius:18px;padding:26px 22px;margin-bottom:8px}
  .hero h1{color:#fff;font-size:24px} .hero p{margin:6px 0 16px;opacity:.95}
  .hero .herosearch{display:flex;max-width:560px;background:#fff;border-radius:12px;padding:5px;gap:6px}
  .hero .herosearch input{border:none;padding:11px 14px;flex:1;min-width:0}
  .hero .herosearch button{border-radius:9px}

  .grid{display:grid;gap:14px}
  .shops{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .prods{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px}
  .card.clickable{cursor:pointer;transition:box-shadow .15s,transform .15s}
  .card.clickable:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex:none}
  .thumb{height:92px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#fff;margin-bottom:10px}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.rx{background:#FEF3C7;color:#92400E}
  .pill.open{background:#DCFCE7;color:#166534}
  .pill.placed{background:#FEF3C7;color:#92400E}
  .pill.accepted{background:#DBEAFE;color:#1e40af}
  .pill.ready{background:#E0E7FF;color:#3730a3}
  .pill.assigned{background:#FEF3C7;color:#92400E}
  .pill.out_for_delivery{background:#DBEAFE;color:#1e40af}
  .pill.delivered{background:#DCFCE7;color:var(--success)}
  .pill.rejected,.pill.cancelled{background:#FEE2E2;color:var(--error)}

  .price{font-weight:800;font-size:17px}
  .mrp{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px}
  .off{color:var(--success);font-size:12px;font-weight:700;margin-left:6px}
  .stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .stepper button{background:#fff;color:var(--blue);padding:6px 12px;border-radius:0}
  .stepper button:hover{background:var(--blue-light)}
  .stepper span{min-width:34px;text-align:center;font-weight:700}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;margin-bottom:10px;font-size:14px}
  .back:hover{color:var(--blue)}
  .empty{text-align:center;color:var(--muted);padding:50px 16px}
  .empty .big{font-size:40px;margin-bottom:8px}

  .panel{max-width:460px;margin:0 auto}
  .banner{border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}
  .banner.info{background:var(--blue-light);color:var(--blue-dark)}
  .banner.warn{background:#FEF3C7;color:#92400E}
  .banner.okb{background:#DCFCE7;color:#166534}

  .toast{position:fixed;right:16px;bottom:16px;max-width:360px;padding:12px 16px;border-radius:10px;color:#fff;box-shadow:var(--shadow-lg);font-size:14px;z-index:60}
  .toast.err{background:var(--error)} .toast.ok{background:var(--success)}

  .sticky-sum{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 0;margin-top:14px}
  .trust{overflow:hidden;padding:8px 0;margin-bottom:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
  .trust-track{display:flex;gap:16px;width:max-content;animation:trustScroll 24s linear infinite}
  .trust:hover .trust-track{animation-play-state:paused}
  .trust span{position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:7px;padding:13px 26px;border-radius:999px;font-size:13.5px;font-weight:800;color:#fff;white-space:nowrap;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.28);box-shadow:0 12px 22px -6px rgba(16,24,40,.40),0 3px 6px rgba(16,24,40,.22),inset 0 2px 1px rgba(255,255,255,.6),inset 0 -5px 10px rgba(0,0,0,.24);animation:trustBob 3s ease-in-out infinite}
  .trust span::before{content:"";position:absolute;left:7%;right:7%;top:3px;height:44%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
  .trust span::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:trustShine 3.6s ease-in-out infinite;pointer-events:none}
  .trust span:nth-child(4n+1){background:linear-gradient(160deg,#5eead4,#0d9488 70%)}
  .trust span:nth-child(4n+2){background:linear-gradient(160deg,#93c5fd,#2563eb 70%)}
  .trust span:nth-child(4n+3){background:linear-gradient(160deg,#d8b4fe,#7c3aed 70%)}
  .trust span:nth-child(4n+4){background:linear-gradient(160deg,#fcd34d,#d97706 70%)}
  .trust span:nth-child(2n){animation-delay:.6s}
  .trust span:nth-child(3n){animation-delay:1.1s}
  @keyframes trustScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes trustBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes trustShine{0%{left:-60%}55%,100%{left:125%}}
  @media(prefers-reduced-motion:reduce){.trust-track{animation:none;flex-wrap:wrap;justify-content:center}}
  .promo{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:14px;padding:14px 16px;margin:16px 0}
  .promo-ic{width:42px;height:42px;border-radius:10px;background:#10B981;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .cat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text);transition:box-shadow .15s,transform .15s}
  .cat:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--blue)}
  .cat .ce{font-size:26px;margin-bottom:6px}
  .track{display:flex;align-items:flex-start;margin-top:12px;overflow-x:auto;padding-bottom:4px}
  .tstep{display:flex;flex-direction:column;align-items:center;min-width:62px;flex:none}
  .tdot{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--border)}
  .tstep.done .tdot{background:var(--blue);border-color:var(--blue)}
  .tstep.cur .tdot{box-shadow:0 0 0 3px #99F6E4}
  .tlabel{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;font-weight:600;line-height:1.3}
  .tstep.done .tlabel{color:var(--text)}
  .ttime{font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
  .tline{height:2px;background:var(--border);flex:1;margin-top:7px;min-width:14px}
  .tline.done{background:var(--blue)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--success);font-weight:600}
  .live .ld{width:7px;height:7px;border-radius:50%;background:var(--success);animation:lp 1.4s ease-in-out infinite}
  @keyframes lp{0%,100%{opacity:.35}50%{opacity:1}}
  .filterbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .filterbar select{width:auto;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit;color:var(--text);font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .stars{color:#F59E0B;letter-spacing:1px}
  .ratepick{font-size:28px;letter-spacing:4px;color:#F59E0B;cursor:pointer;user-select:none}
  .ratepick span{cursor:pointer}
  .reviewitem{border-top:1px solid var(--border);padding:10px 0}
  .reviewitem:first-child{border-top:none}
  @media(max-width:640px){
    .brand span.full{display:none}
    .navbtns button.small{padding:8px 10px}
    .topbar-in{gap:8px;padding:10px 12px}

    /* Categories: swipe sideways instead of a tall grid */
    .cats{display:flex;overflow-x:auto;gap:10px;padding-bottom:6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
    .cats::-webkit-scrollbar{display:none}
    .cat{flex:0 0 92px;scroll-snap-align:start;padding:12px 6px}
    .cat .ce{font-size:24px;margin-bottom:4px}

    /* Medical shops: swipe sideways, smaller compact cards */
    .shops{display:flex;overflow-x:auto;gap:12px;padding-bottom:6px;grid-template-columns:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
    .shops::-webkit-scrollbar{display:none}
    .shops>.card{flex:0 0 235px;scroll-snap-align:start;padding:12px}
    .shops>.card .avatar{width:40px;height:40px;font-size:16px;border-radius:10px}
    .shops>.card .row[style*="margin-top:12px"]{margin-top:8px!important}

    /* Medicines: two columns, shorter image so cards aren't so long */
    .prods{grid-template-columns:1fr 1fr;gap:10px}
    .prods>.card{padding:10px}
    .prods .thumb{height:66px;font-size:24px;margin-bottom:8px}
    .prods>.card strong{font-size:14px}
    .prods>.card .sub{font-size:12px}

    /* Hero search: smaller font + tighter buttons so the placeholder isn't clipped */
    .hero .herosearch input{font-size:14px;padding:11px 8px}
    .hero .herosearch #heroBtn{padding:10px 12px;font-size:14px}
    .hero .herosearch #heroMic,.hero .herosearch #heroCam{padding:0 3px!important;font-size:17px!important}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand" id="brandBtn"><span class="logo">+</span><span class="full">MedMart</span></div>
    <div class="searchbox" id="topSearch">
      <span class="ic">🔍</span>
      <input id="globalSearch" placeholder="Search medicines…" />
      <button id="micBtn" title="Search by voice — tap and say the medicine name" style="background:transparent;color:var(--muted);padding:0 6px;font-size:20px;border:none">🎤</button>
      <button id="scanBtn" title="Search by photo of a tablet strip or note" style="background:transparent;color:var(--muted);padding:0 10px;font-size:20px;border:none">📷</button>
    </div>
    <div class="navbtns">
      <div class="notif-wrap">
        <button class="ghost small notifbtn" id="notifBtn" title="Notifications">🔔<span class="count hidden" id="notifCount">0</span></button>
        <div id="notifPanel" class="notif-panel hidden"></div>
      </div>
      <button class="ghost small cartbtn" id="cartBtn">🛒<span class="count hidden" id="cartCount">0</span></button>
      <button class="light small" id="accountBtn">Account</button>
    </div>
  </div>
</div>

<div class="wrap" id="view"></div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
/* ---------------- infra ---------------- */
const $=(id)=>document.getElementById(id);
const view=$('view');
const state={ token:localStorage.getItem('cust_token')||'', user:null, cart:[], view:'home' };
try{ state.cart=JSON.parse(localStorage.getItem('cust_cart')||'[]')||[]; }catch{ state.cart=[]; }

function saveCart(){ try{ localStorage.setItem('cust_cart',JSON.stringify(state.cart)); }catch{} updateCartCount(); }
function updateCartCount(){ const n=state.cart.reduce((s,i)=>s+i.qty,0); const el=$('cartCount'); el.textContent=n; el.classList.toggle('hidden',n===0); }
function toast(m,ok=false){ const t=document.createElement('div'); t.className='toast '+(ok?'ok':'err'); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return '₹'+Number(n||0).toFixed(0); }
function colorFor(s){ const c=['#0D9488','#0891B2','#059669','#7C3AED','#D97706','#DB2777','#2563EB','#4F46E5']; let h=0; for(const ch of String(s||'')) h=(h*31+ch.charCodeAt(0))>>>0; return c[h%c.length]; }
function initials(s){ return String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'; }
function medIcon(form){ switch(form){ case 'injection':return '💉'; case 'drops':return '💧'; case 'syrup': case 'suspension':return '🍶'; case 'cream': case 'ointment': case 'gel':return '🧴'; case 'inhaler':return '🌬️'; case 'powder': case 'sachet':return '🧂'; default:return '💊'; } }
function thumbHtml(o){
  if(o && o.imageUrl) return `<div class="thumb" style="background:#fff;border:1px solid var(--border);padding:8px"><img src="${esc(o.imageUrl)}" alt="" style="max-height:100%;max-width:100%;object-fit:contain" onerror="this.parentNode.innerHTML='💊';this.parentNode.style.background='${colorFor(o.name)}';this.parentNode.style.color='#fff'"/></div>`;
  return `<div class="thumb" style="background:linear-gradient(135deg,${colorFor(o&&o.name)},${colorFor(((o&&o.name)||'')+'•')})"><div style="text-align:center;line-height:1.1"><div style="font-size:30px">${medIcon(o&&o.dosageForm)}</div><div style="font-size:12px;font-weight:700;margin-top:3px;letter-spacing:.5px">${esc(initials(o&&o.name))}</div></div></div>`;
}
function starsHtml(rating,count){
  const r=Number(rating)||0;
  if(!r) return '<span class="sub" style="font-size:12px">No ratings yet</span>';
  const full=Math.round(r); let s='';
  for(let i=1;i<=5;i++) s+= i<=full?'★':'☆';
  return `<span class="stars" title="${r} out of 5">${s}</span> <span class="sub" style="font-size:12px">${r.toFixed(1)}${count?' ('+count+')':''}</span>`;
}
function compressImage(file, cb, max=1200, quality=0.6){
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } } const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); try{ cb(c.toDataURL('image/jpeg',quality)); }catch{ cb(null); } }; img.onerror=()=>cb(null); img.src=e.target.result; };
  reader.onerror=()=>cb(null); reader.readAsDataURL(file);
}

async function refreshAccess(){
  const rt=localStorage.getItem('cust_refresh'); if(!rt) return false;
  try{
    const r=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:rt})});
    if(!r.ok) return false;
    const d=await r.json();
    state.token=d.accessToken; localStorage.setItem('cust_token',d.accessToken);
    if(d.refreshToken) localStorage.setItem('cust_refresh',d.refreshToken);
    return true;
  }catch{ return false; }
}
async function api(path,opts={}){
  const send=()=>fetch(path,{...opts,headers:{'Content-Type':'application/json',...(state.token?{'Authorization':'Bearer '+state.token}:{}),...(opts.headers||{})}});
  let r=await send();
  if(r.status===401 && state.token && await refreshAccess()) r=await send();
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401 && state.token){ state.token=''; state.user=null; try{localStorage.removeItem('cust_token');localStorage.removeItem('cust_refresh');}catch{} }
    throw new Error(d?.error?.message||('Request failed ('+r.status+')'));
  }
  return d;
}

/* ---------------- cart ---------------- */
function addToCart(p){
  if(!p.inStock){ toast('Out of stock'); return; }
  const ex=state.cart.find(i=>i.listingId===p.listingId);
  if(ex){ ex.qty=Math.min(ex.qty+1,p.available||99); }
  else state.cart.push({ listingId:p.listingId, pharmacyId:p.pharmacyId, pharmacyName:p.pharmacyName, name:p.name, sellingPrice:p.sellingPrice, mrp:p.mrp, prescriptionRequired:p.prescriptionRequired, available:p.available||99, qty:1 });
  saveCart(); toast('Added to cart',true);
}
function setQty(listingId,qty){
  const i=state.cart.find(x=>x.listingId===listingId); if(!i) return;
  i.qty=Math.max(0,Math.min(qty,i.available||99));
  if(i.qty===0) state.cart=state.cart.filter(x=>x.listingId!==listingId);
  saveCart(); if(state.view==='cart') renderCart();
}
function cartTotal(){ return state.cart.reduce((s,i)=>s+i.sellingPrice*i.qty,0); }
function reorder(o){
  if(!o.items || !o.items.length){ toast('Nothing to reorder'); return; }
  for(const it of o.items){
    const li={ listingId:it.listing, pharmacyId:o.pharmacy&&o.pharmacy._id, pharmacyName:o.pharmacy&&o.pharmacy.name, name:it.name, sellingPrice:it.unitPrice, mrp:it.unitPrice, prescriptionRequired:it.prescriptionRequired, available:99, qty:it.quantity||1 };
    const ex=state.cart.find(x=>x.listingId===li.listingId);
    if(ex) ex.qty=ex.qty+li.qty; else state.cart.push(li);
  }
  saveCart(); toast('Added to cart',true); go('cart');
}

/* ---------------- navigation ---------------- */
function go(v,arg){ state.view=v; window.scrollTo(0,0);
  { const ts=$('topSearch'); if(ts) ts.style.display=(['search','medicine','shop'].includes(v))?'flex':'none'; }
  if(state._pollTimer && v!=='orders'){ clearInterval(state._pollTimer); state._pollTimer=null; }
  if(v==='home') renderHome();
  else if(v==='shop') renderShop(arg);
  else if(v==='search') renderSearch(arg);
  else if(v==='medicine') renderMedicine(arg);
  else if(v==='cart') renderCart();
  else if(v==='checkout') renderCheckout();
  else if(v==='account') renderAccount();
  else if(v==='orders') renderOrders();
  else if(v==='prescription') renderPrescription();
}
function backLink(label,onclick){ const d=document.createElement('div'); d.className='back'; d.innerHTML='← '+esc(label); d.onclick=onclick; return d; }

/* ---------------- HOME ---------------- */
/* ---------------- QUICK PICKS (recent + saved searches) ---------------- */
function getRecent(){ try{ return JSON.parse(localStorage.getItem('medmart_recent')||'[]'); }catch{ return []; } }
function addRecent(q){ if(!q) return; try{ let a=getRecent().filter(x=>x.toLowerCase()!==q.toLowerCase()); a.unshift(q); localStorage.setItem('medmart_recent',JSON.stringify(a.slice(0,8))); }catch{} }
function clearRecent(){ try{ localStorage.removeItem('medmart_recent'); }catch{} }
async function getSaved(){ if(!state.token){ state._saved=[]; return []; } try{ const d=await api('/api/customer/saved-searches'); state._saved=d.items||[]; }catch{ state._saved=state._saved||[]; } return state._saved; }
function isSaved(q){ return (state._saved||[]).some(s=>s.toLowerCase()===String(q).toLowerCase()); }
async function toggleSaved(q){ if(!state.token){ toast('Sign in to save your favourites'); return false; } try{ if(isSaved(q)){ await api('/api/customer/saved-searches/'+encodeURIComponent(q),{method:'DELETE'}); } else { await api('/api/customer/saved-searches',{method:'POST',body:JSON.stringify({q})}); } await getSaved(); return true; }catch(e){ toast(e.message); return false; } }
function quickPicksEl(){
  const recent=getRecent(), saved=state._saved||[];
  if(!recent.length && !saved.length) return null;
  const c=document.createElement('div'); c.className='card'; c.style.marginBottom='8px';
  let html='';
  if(saved.length){ html+='<div class="sub" style="margin-bottom:6px">⭐ Saved</div><div class="chips">'+saved.map(s=>`<span class="chip" data-q="${esc(s)}">${esc(s)}</span>`).join('')+'</div>'; }
  if(recent.length){ html+='<div class="sub" style="margin:'+(saved.length?'12px':'0')+' 0 6px">🕘 Recent <span id="clrRecent" style="color:var(--muted);cursor:pointer;font-weight:600">· clear</span></div><div class="chips">'+recent.map(s=>`<span class="chip" data-q="${esc(s)}">${esc(s)}</span>`).join('')+'</div>'; }
  c.innerHTML=html;
  c.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ const qq=ch.dataset.q; if($('globalSearch'))$('globalSearch').value=qq; if($('heroSearch'))$('heroSearch').value=qq; state._searchQ=qq; go('search',qq); });
  const clr=c.querySelector('#clrRecent'); if(clr) clr.onclick=()=>{ clearRecent(); const fresh=quickPicksEl(); if(c.parentNode){ if(fresh) c.parentNode.replaceChild(fresh,c); else c.remove(); } };
  return c;
}

/* Typewriter placeholder: cycles example phrases inside a search box. */
const _phTimers={};
function typePlaceholder(key, el, phrases, prefix=''){
  if(!el) return;
  if(_phTimers[key]) clearTimeout(_phTimers[key]);
  let p=0, c=0, deleting=false;
  el.placeholder=prefix;
  const tick=()=>{
    if(!document.body.contains(el)) return;                 // input was replaced — stop
    if(document.activeElement===el || el.value){ _phTimers[key]=setTimeout(tick,600); return; } // don't disturb typing
    const full=phrases[p];
    if(!deleting){
      c++; el.placeholder=prefix+full.slice(0,c);
      if(c>=full.length){ deleting=true; _phTimers[key]=setTimeout(tick,1500); return; }
    } else {
      c--; el.placeholder=prefix+full.slice(0,c);
      if(c<=0){ deleting=false; p=(p+1)%phrases.length; _phTimers[key]=setTimeout(tick,300); return; }
    }
    _phTimers[key]=setTimeout(tick, deleting?45:70);
  };
  tick();
}

/* ---------------- CUSTOMER LOCATION ---------------- */
function getLoc(){ try{ return JSON.parse(localStorage.getItem('medmart_loc')||'null'); }catch{ return null; } }
function setLoc(v){ try{ v?localStorage.setItem('medmart_loc',JSON.stringify(v)):localStorage.removeItem('medmart_loc'); }catch{} }
function locQuery(){ const l=getLoc(); if(!l) return ''; if(l.mode==='gps') return '?lat='+l.lat+'&lng='+l.lng; if(l.mode==='text') return '?location='+encodeURIComponent(l.text); return ''; }
function renderLocBar(){
  const box=$('locBar'); if(!box) return;
  const l=getLoc();
  const label = !l ? 'Showing all shops' : (l.mode==='gps' ? '📍 Nearest to you' : '📍 Area: '+esc(l.text));
  box.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><strong>${label}</strong><span class="sp"></span>
    <button class="light small" id="locNear">📍 Near me</button>
    <input id="locText" placeholder="Area or PIN" style="width:130px;padding:8px" />
    <button class="secondary small" id="locApply">Go</button>
    ${l?'<button class="ghost small" id="locClear">Show all</button>':''}
  </div>
  <div class="row" style="gap:8px;margin-top:10px;align-items:center">
    <span style="font-size:17px">🔍</span>
    <input id="shopNameSearch" placeholder="Search a shop by name, e.g. Shanti Medical" style="flex:1;min-width:140px;padding:8px" />
    <button class="secondary small" id="shopNameBtn">Find</button>
    ${(window._shopQ||'')?'<button class="ghost small" id="shopNameClear">Clear</button>':''}
  </div></div>`;
  $('locNear').onclick=useMyLocation;
  $('locApply').onclick=()=>{ const t=$('locText').value.trim(); if(!t){ toast('Type an area or PIN'); return; } setLoc({mode:'text',text:t}); renderLocBar(); loadShops(); };
  $('locText').addEventListener('keydown',e=>{ if(e.key==='Enter') $('locApply').click(); });
  const clr=$('locClear'); if(clr) clr.onclick=()=>{ setLoc(null); renderLocBar(); loadShops(); };
  const sns=$('shopNameSearch'); if(sns){ sns.value=window._shopQ||''; }
  $('shopNameBtn').onclick=()=>{ window._shopQ=$('shopNameSearch').value.trim(); loadShops(); };
  $('shopNameSearch').addEventListener('input',e=>{ window._shopQ=e.target.value.trim(); clearTimeout(window._shopQT); window._shopQT=setTimeout(loadShops,300); });
  $('shopNameSearch').addEventListener('keydown',e=>{ if(e.key==='Enter'){ window._shopQ=e.target.value.trim(); loadShops(); } });
  const snc=$('shopNameClear'); if(snc) snc.onclick=()=>{ window._shopQ=''; renderLocBar(); loadShops(); };
  typePlaceholder('shopName',$('shopNameSearch'),["Search a shop…","Find 'ABC Medicals'…","A pharmacy near you…","Your usual store…"]);
}
function useMyLocation(){
  if(!navigator.geolocation){ toast('Location is not available on this device'); return; }
  toast('Getting your location…',true);
  navigator.geolocation.getCurrentPosition(
    pos=>{ setLoc({mode:'gps',lat:pos.coords.latitude,lng:pos.coords.longitude}); renderLocBar(); loadShops(); toast('Showing shops nearest to you',true); },
    err=>toast(err.code===1?'Please allow location access':'Could not get your location — try again'),
    {enableHighAccuracy:true,timeout:12000});
}
async function loadShops(){
  const box=$('shopList'); if(!box) return;
  box.innerHTML='<p class="muted">Loading shops…</p>';
  try{
    const params=[]; const l=getLoc();
    if(l){ if(l.mode==='gps'){ params.push('lat='+l.lat,'lng='+l.lng); } else if(l.mode==='text'){ params.push('location='+encodeURIComponent(l.text)); } }
    const sq=(window._shopQ||'').trim(); if(sq) params.push('q='+encodeURIComponent(sq));
    const d=await api('/api/discover/pharmacies'+(params.length?('?'+params.join('&')):''));
    const shops=d.items||[];
    box.innerHTML = shops.length ? '' : ('<p class="muted">'+(sq?('No shop matches “'+esc(sq)+'” here. Try a different name or tap “Show all”.'):'No shops found for this location. Tap “Show all”.')+'</p>');
    for(const s of shops) box.appendChild(shopCard(s));
  }catch(e){ box.innerHTML='<p class="muted">Could not load shops.</p>'; }
}

function shopCard(s){
  const c=document.createElement('div'); c.className='card clickable';
  const city=[s.address?.line1,s.address?.city].filter(Boolean).join(', ');
  const dist=(s.distanceKm!=null)?` · ${s.distanceKm} km`:'';
  const hrs=s.operatingHours?`${s.operatingHours.open||''}–${s.operatingHours.close||''}`:'';
  c.innerHTML=`
    <div class="row">
      <div class="avatar" style="background:${colorFor(s.name)}">${esc(initials(s.name))}</div>
      <div><strong>${esc(s.name)}</strong><div class="sub">${esc(city||'Pharmacy')}${dist}</div><div style="margin-top:3px">${starsHtml(s.rating,s.ratingCount)}</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      ${hrs?`<span class="pill open">🕐 ${esc(hrs)}</span>`:''}
      <span class="sp"></span>
      <span class="ghost small" style="color:var(--blue);font-weight:700">View shop →</span>
    </div>`;
  c.onclick=()=>go('shop',s._id);
  return c;
}

function medCatalogueCard(m){
  const c=document.createElement('div'); c.className='card clickable';
  const meta=[m.strength,m.packSize].filter(Boolean).join(' · ');
  c.innerHTML=`
    ${thumbHtml(m)}
    <strong>${esc(m.name)}</strong>
    <div class="sub">${esc(meta||m.brand||'Medicine')}</div>
    ${m.prescriptionRequired?'<span class="pill rx" style="margin-top:8px">Rx</span>':''}
    <div style="margin-top:10px"><button class="light small" style="width:100%">See pharmacies</button></div>`;
  c.onclick=()=>go('medicine',m._id);
  return c;
}

/* ---------------- SHOP ---------------- */
async function renderShop(id){
  view.innerHTML='<p class="muted">Loading shop…</p>';
  try{
    const d=await api('/api/discover/pharmacies/'+id+'/products');
    const ph=d.pharmacy, prods=d.products||[];
    view.innerHTML='';
    view.appendChild(backLink('Back to shops',()=>go('home')));
    const addr=[ph.address?.line1,ph.address?.city,ph.address?.pincode].filter(Boolean).join(', ');
    const head=document.createElement('div'); head.className='card'; head.innerHTML=`
      <div class="row">
        <div class="avatar" style="background:${colorFor(ph.name)}">${esc(initials(ph.name))}</div>
        <div><h1>${esc(ph.name)}</h1><div class="sub">${esc(addr||'')}</div><div style="margin-top:4px">${starsHtml(ph.rating,ph.ratingCount)}</div></div>
      </div>`;
    view.appendChild(head);

    const sb=document.createElement('div'); sb.className='searchbox'; sb.style.margin='16px 0';
    sb.innerHTML='<span class="ic">🔍</span><input id="shopSearch" placeholder="Search in this shop…" />';
    view.appendChild(sb);

    const fb=document.createElement('div'); fb.className='filterbar';
    fb.innerHTML=`
      <select id="sortSel">
        <option value="name">Sort: Name A–Z</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
      <div class="chips">
        <span class="chip active" data-f="all">All</span>
        <span class="chip" data-f="instock">In stock</span>
        <span class="chip" data-f="otc">OTC</span>
        <span class="chip" data-f="rx">Rx</span>
      </div>`;
    view.appendChild(fb);

    const grid=document.createElement('div'); grid.className='grid prods'; grid.id='shopGrid'; view.appendChild(grid);
    let curQ='', curFilter='all', curSort='name';
    function applyDraw(){
      let list=prods.slice();
      if(curQ) list=list.filter(p=>p.name.toLowerCase().includes(curQ));
      if(curFilter==='instock') list=list.filter(p=>p.inStock);
      else if(curFilter==='otc') list=list.filter(p=>!p.prescriptionRequired);
      else if(curFilter==='rx') list=list.filter(p=>p.prescriptionRequired);
      if(curSort==='price-asc') list.sort((a,b)=>a.sellingPrice-b.sellingPrice);
      else if(curSort==='price-desc') list.sort((a,b)=>b.sellingPrice-a.sellingPrice);
      else list.sort((a,b)=>a.name.localeCompare(b.name));
      grid.innerHTML = list.length ? '' : '<p class="muted">No matching products.</p>';
      for(const p of list){ p.pharmacyId=ph._id; p.pharmacyName=ph.name; grid.appendChild(productCard(p)); }
    }
    applyDraw();
    $('shopSearch').addEventListener('input',e=>{ curQ=e.target.value.trim().toLowerCase(); applyDraw(); });
    $('sortSel').addEventListener('change',e=>{ curSort=e.target.value; applyDraw(); });
    fb.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ fb.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); curFilter=c.dataset.f; applyDraw(); }));

    const reviews=d.reviews||[];
    if(reviews.length){
      const rc=document.createElement('div'); rc.className='card'; rc.style.marginTop='18px';
      rc.innerHTML='<h2 style="margin-top:0">Customer reviews</h2>'+reviews.map(rv=>`
        <div class="reviewitem">
          <div class="row"><strong>${esc(rv.customerName||'Customer')}</strong><span class="sp"></span><span class="stars">${'★'.repeat(rv.rating)}${'☆'.repeat(5-rv.rating)}</span></div>
          ${rv.comment?`<div class="sub" style="margin-top:4px">${esc(rv.comment)}</div>`:''}
        </div>`).join('');
      view.appendChild(rc);
    }
  }catch(e){ view.innerHTML=''; view.appendChild(backLink('Back to shops',()=>go('home'))); const d=document.createElement('p'); d.className='muted'; d.textContent=e.message; view.appendChild(d); }
}

function productCard(p){
  const c=document.createElement('div'); c.className='card';
  const meta=[p.strength,p.packSize].filter(Boolean).join(' · ');
  const off=(p.mrp>p.sellingPrice)?Math.round((1-p.sellingPrice/p.mrp)*100):0;
  c.innerHTML=`
    ${thumbHtml(p)}
    <strong>${esc(p.name)}</strong>
    <div class="sub">${esc(meta||p.brand||'')}</div>
    <div style="margin:8px 0">
      ${p.prescriptionRequired?'<span class="pill rx">Rx</span>':''}
      ${p.inStock?'':'<span class="pill rejected">Out of stock</span>'}
    </div>
    <div class="row">
      <span class="price">${money(p.sellingPrice)}</span>
      ${p.mrp>p.sellingPrice?`<span class="mrp">${money(p.mrp)}</span><span class="off">${off}% off</span>`:''}
    </div>
    <div class="addwrap" style="margin-top:10px"></div>`;
  const aw=c.querySelector('.addwrap');
  const b=document.createElement('button'); b.className='small'; b.style.width='100%'; b.textContent=p.inStock?'Add to cart':'Unavailable'; b.disabled=!p.inStock;
  b.onclick=()=>addToCart(p); aw.appendChild(b);
  return c;
}

/* ---------------- SEARCH ---------------- */
async function renderSearch(q){
  view.innerHTML='';
  view.appendChild(backLink('Back to home',()=>go('home')));
  if(q) addRecent(q);
  await getSaved();

  const head=document.createElement('div'); head.className='row';
  head.innerHTML=`<h1 style="margin:0">${q?`Results for “${esc(q)}”`:'All medicines'}</h1><span class="sp"></span>`;
  if(q){
    const sv=document.createElement('button'); sv.className='ghost small';
    sv.textContent=isSaved(q)?'⭐ Saved':'☆ Save';
    sv.onclick=async()=>{ const ok=await toggleSaved(q); if(ok) sv.textContent=isSaved(q)?'⭐ Saved':'☆ Save'; };
    head.appendChild(sv);
  }
  view.appendChild(head);

  const qp=quickPicksEl(); if(qp){ qp.style.marginTop='12px'; view.appendChild(qp); }

  const grid=document.createElement('div'); grid.className='grid prods'; grid.style.marginTop='12px'; grid.innerHTML='<p class="muted">Searching…</p>'; view.appendChild(grid);
  const moreWrap=document.createElement('div'); moreWrap.style.cssText='text-align:center;margin-top:14px'; view.appendChild(moreWrap);
  let page=1, loading=false, done=false;
  async function loadPage(){
    if(loading||done) return; loading=true;
    moreWrap.innerHTML='<p class="muted">Loading…</p>';
    try{
      const d=await api('/api/discover/medicines?page='+page+(q?('&q='+encodeURIComponent(q)):''));
      const meds=d.items||[];
      if(page===1) grid.innerHTML = meds.length ? '' : (q?`<div class="empty"><div class="big">🔍</div>No medicines found for “${esc(q)}”.</div>`:'<p class="muted">No medicines yet.</p>');
      for(const m of meds) grid.appendChild(medCatalogueCard(m));
      const total=(d.total!=null)?d.total:grid.children.length;
      done = (d.pages!=null) ? (page>=d.pages || !meds.length) : (meds.length<(d.limit||60));
      page++;
      moreWrap.innerHTML='';
      if(!done){
        const b=document.createElement('button'); b.className='secondary'; b.textContent='Load more'; b.onclick=loadPage; moreWrap.appendChild(b);
      }
      if(grid.children.length && total){ const c=document.createElement('div'); c.className='sub'; c.style.marginTop='8px'; c.textContent='Showing '+grid.children.length+' of '+total+' medicines'; moreWrap.appendChild(c); }
    }catch(e){ moreWrap.innerHTML=''; if(page===1) grid.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
    loading=false;
  }
  await loadPage();
}

/* ---------------- SEARCH BY VOICE ---------------- */
function voiceSearch(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Voice search isn’t supported on this browser — try typing or the 📷'); return; }
  const rec=new SR();
  rec.lang='en-IN'; rec.interimResults=false; rec.maxAlternatives=1;
  const btn=$('micBtn'); if(btn) btn.textContent='🔴';
  toast('🎤 Listening… say the medicine name',true);
  rec.onresult=(e)=>{ const t=((e.results[0]&&e.results[0][0]&&e.results[0][0].transcript)||'').trim(); if(t){ if($('globalSearch')) $('globalSearch').value=t; state._searchQ=t; go('search',t); } else { toast('Didn’t catch that — try again'); } };
  rec.onerror=(e)=>{ toast(e.error==='not-allowed'?'Please allow microphone access':'Didn’t catch that — try again'); };
  rec.onend=()=>{ if($('micBtn')) $('micBtn').textContent='🎤'; };
  try{ rec.start(); }catch{ toast('Could not start the mic — try again'); if($('micBtn')) $('micBtn').textContent='🎤'; }
}

/* ---------------- SEARCH BY PHOTO ---------------- */
function scanPhoto(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    toast('Reading your photo…',true);
    compressImage(f,(data)=>{ if(!data){ toast('Could not read that image — try another'); return; } doScan(data); }, 900, 0.45);
  };
  inp.click();
}
async function doScan(image){
  if(state._pollTimer){ clearInterval(state._pollTimer); state._pollTimer=null; }
  state.view='scan'; window.scrollTo(0,0);
  view.innerHTML='';
  view.appendChild(backLink('Back to home',()=>go('home')));
  const h=document.createElement('h1'); h.textContent='Search by photo'; view.appendChild(h);
  const box=document.createElement('div'); box.style.marginTop='12px'; box.innerHTML='<p class="muted">🔎 Reading the medicine names from your photo…</p>'; view.appendChild(box);
  try{
    const d=await api('/api/discover/scan',{method:'POST',body:JSON.stringify({ image })});
    renderScanResults(d, box);
  }catch(e){ box.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
}

async function placeOrders(){
  const addr={ line1:$('coLine1').value.trim(), city:$('coCity').value.trim(), pincode:$('coPin').value.trim(), phone:$('coPhone').value.trim(), instructions:$('coNote').value.trim() };
  if(!addr.line1){ toast('Please enter your address'); return; }
  if(!/^\d{6}$/.test(addr.pincode)){ toast('Enter a valid 6-digit PIN code'); return; }
  const hasRx=state.cart.some(i=>i.prescriptionRequired);
  if(hasRx && !state._prescription){ toast('Please upload your prescription for the Rx medicines'); return; }
  const wantSave = $('saveAddr') && $('saveAddr').checked;
  const payMethod = (document.querySelector('input[name="pay"]:checked')||{}).value || 'cod';
  const sub=cartTotal();
  $('placeBtn').disabled=true; $('placeBtn').textContent='Placing order…';
  const ok=[], fail=[], orderIds=[]; let payable=0;
  for(const i of state.cart){
    const body={ listingId:i.listingId, quantity:i.qty, deliveryAddress:addr, paymentMethod:payMethod };
    if(state._coupon){ body.couponCode=state._coupon.code; body.cartSubtotal=sub; }
    if(i.prescriptionRequired && state._prescription) body.prescriptionImage=state._prescription;
    try{ const r=await api('/api/customer/orders',{method:'POST',body:JSON.stringify(body)}); ok.push(i); if(r.order){ orderIds.push(r.order._id); payable+=r.order.total||0; } }
    catch(e){ fail.push({ i, msg:e.message }); }
  }
  // remove successful lines
  state.cart=state.cart.filter(i=>!ok.includes(i)); saveCart();
  if(fail.length===0){
    if(wantSave){ try{ await api('/api/customer/addresses',{method:'POST',body:JSON.stringify({ label:addr.city||'Home', line1:addr.line1, city:addr.city, pincode:addr.pincode, phone:addr.phone, instructions:addr.instructions })}); }catch{} }
    state._prescription=null;
    if(payMethod==='online' && payable>0){ await payOnline(orderIds, payable); }
    else { state._coupon=null; toast('Order placed! 🎉',true); go('orders'); }
  }
  else{
    $('placeBtn').disabled=false; $('placeBtn').textContent='Place order · '+money(cartTotal());
    toast(ok.length?`${ok.length} placed, ${fail.length} failed: ${fail[0].msg}`:fail[0].msg);
    if(ok.length) renderCheckout();
  }
}

/* ---------------- MY ORDERS (live tracking) ---------------- */
function trackerHtml(o){
  if(o.status==='rejected'||o.status==='cancelled'){
    return `<div class="banner" style="background:#FEE2E2;color:#991B1B;margin-top:10px">${o.status==='rejected'?'This order was rejected by the pharmacy.':'This order was cancelled.'}</div>`;
  }
  const steps=[['placed','Placed'],['accepted','Accepted'],['ready','Ready'],['out_for_delivery','On the way'],['delivered','Delivered']];
  const idx={placed:0,accepted:1,ready:2,assigned:2,out_for_delivery:3,delivered:4};
  const cur=idx[o.status]??0;
  const times={}; (o.timeline||[]).forEach(t=>{ times[t.status]=t.at; });
  let html='<div class="track">';
  steps.forEach((s,i)=>{
    const done=i<=cur, isCur=i===cur;
    const t=times[s[0]]; const when=(t&&done)?new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    html+=`<div class="tstep ${done?'done':''} ${isCur?'cur':''}"><div class="tdot"></div><div class="tlabel">${s[1]}${when?`<div class="ttime">${when}</div>`:''}</div></div>`;
    if(i<steps.length-1) html+=`<div class="tline ${i<cur?'done':''}"></div>`;
  });
  html+='</div>';
  return html;
}

function orderCard(o){
  const it=o.items&&o.items[0]||{};
  const card=document.createElement('div'); card.className='card'; card.style.marginBottom='10px';
  const otp=(o.status==='out_for_delivery'&&o.deliveryOtp)?`<div class="banner okb" style="margin-top:10px"><strong>Delivery OTP: ${esc(o.deliveryOtp)}</strong> — give this to the delivery person at your door.</div>`:'';
  const isRx=o.kind==='prescription';
  const priceHtml = (isRx && !(o.total>0)) ? '<span class="sub">Amount pending</span>' : `<span class="price">${money(o.total)}</span>`;
  const detail = isRx
    ? `📄 Prescription order${o.pharmacy?.name?' · '+esc(o.pharmacy.name):' · finding a nearby pharmacy'}${o.prescriptionNote?`<div class="sub">“${esc(o.prescriptionNote)}”</div>`:''}`
    : `${esc(it.name||'')} × ${it.quantity||1} · ${esc(o.pharmacy?.name||'')}`;
  card.innerHTML=`
    <div class="row"><strong>${esc(o.orderNumber)}</strong><span class="pill ${o.status}">${esc(String(o.status).replace(/_/g,' '))}</span>
      <span class="sp"></span>${priceHtml}</div>
    <div class="sub" style="margin-top:4px">${detail}</div>
    ${o.discount>0?`<div class="sub" style="color:var(--success)">Coupon ${esc(o.couponCode||'')}: − ${money(o.discount)} off</div>`:''}
    ${o.kind!=='prescription'?`<div class="sub">${o.paymentStatus==='paid'?'💳 Paid online':'💵 Cash on delivery'}</div>`:''}
    ${trackerHtml(o)}
    ${otp}
    <div class="mtc" style="margin-top:8px"></div>`;
  const mtc=card.querySelector('.mtc');
  if(o.status==='placed'){ const b=document.createElement('button'); b.className='ghost small'; b.textContent='Cancel order'; b.onclick=()=>cancelOrder(o._id); mtc.appendChild(b); }
  if(o.status==='delivered'){
    if(o.myRating>0){
      mtc.innerHTML=`<div class="sub">You rated <span class="stars">${'★'.repeat(o.myRating)}${'☆'.repeat(5-o.myRating)}</span></div>`;
    } else {
      const b=document.createElement('button'); b.className='light small'; b.textContent='⭐ Rate this order'; b.onclick=()=>openRateUI(mtc,o._id); mtc.appendChild(b);
    }
  }
  if(o.kind!=='prescription' && o.items && o.items.length){
    const rb=document.createElement('button'); rb.className='ghost small'; rb.textContent='🔁 Order again'; rb.onclick=()=>reorder(o); mtc.appendChild(rb);
    const rem=document.createElement('button'); rem.className='ghost small'; rem.textContent='⏰ Refill reminder'; rem.onclick=()=>setReminderUI(mtc,o); mtc.appendChild(rem);
  }
  return card;
}

function openRateUI(box,orderId){
  let picked=0;
  box.innerHTML=`
    <div class="sub" style="margin-bottom:4px">Tap the stars to rate this pharmacy</div>
    <div class="ratepick" id="rp_${orderId}">${[1,2,3,4,5].map(i=>`<span data-v="${i}">☆</span>`).join('')}</div>
    <textarea id="rc_${orderId}" placeholder="Add a short comment (optional)" style="width:100%;margin-top:8px;min-height:60px;padding:10px;border:1px solid var(--border);border-radius:10px;font:inherit"></textarea>
    <div class="row" style="margin-top:8px"><button class="small" id="rs_${orderId}">Submit rating</button><button class="ghost small" id="rx_${orderId}">Cancel</button></div>`;
  const pick=box.querySelector('#rp_'+orderId);
  const paint=()=>pick.querySelectorAll('span').forEach(s=>s.textContent = Number(s.dataset.v)<=picked ? '★':'☆');
  pick.querySelectorAll('span').forEach(s=>s.onclick=()=>{ picked=Number(s.dataset.v); paint(); });
  box.querySelector('#rx_'+orderId).onclick=()=>loadOrdersList();
  box.querySelector('#rs_'+orderId).onclick=async()=>{
    if(!picked){ toast('Please tap a star first'); return; }
    const comment=box.querySelector('#rc_'+orderId).value.trim();
    const btn=box.querySelector('#rs_'+orderId); btn.disabled=true; btn.textContent='Submitting…';
    try{ await api('/api/customer/orders/'+orderId+'/review',{method:'POST',body:JSON.stringify({rating:picked,comment})}); toast('Thanks for your rating!',true); loadOrdersList(); }
    catch(e){ toast(e.message); btn.disabled=false; btn.textContent='Submit rating'; }
  };
}

function orderTabKey(o){
  const s=o.status;
  if(s==='delivered') return 'delivered';
  if(s==='cancelled'||s==='rejected') return 'cancelled';
  return 'active';
}
function drawOrderTabs(){
  const box=$('orderTabs'); if(!box) return;
  const orders=state._allOrders||[];
  const counts={all:orders.length,active:0,delivered:0,cancelled:0};
  for(const o of orders) counts[orderTabKey(o)]++;
  const defs=[['all','All'],['active','Active'],['delivered','Delivered'],['cancelled','Cancelled']];
  box.innerHTML='';
  for(const [key,label] of defs){
    const b=document.createElement('button');
    b.className=(state._orderTab===key)?'small':'ghost small';
    b.textContent=label+' ('+counts[key]+')';
    b.onclick=()=>{ state._orderTab=key; drawOrderTabs(); drawOrders(); };
    box.appendChild(b);
  }
}
function drawOrders(){
  const list=$('ordersList'); if(!list) return;
  const tab=state._orderTab||'all';
  const orders=(state._allOrders||[]).filter(o=>tab==='all'||orderTabKey(o)===tab);
  const names={active:'active',delivered:'delivered',cancelled:'cancelled'};
  list.innerHTML = orders.length ? '' : ('<div class="empty"><div class="big">📦</div>No '+(tab==='all'?'':names[tab]+' ')+'orders'+(tab==='all'?' yet':'')+'.</div>');
  for(const o of orders) list.appendChild(orderCard(o));
}
async function loadOrdersList(){
  const list=$('ordersList'); if(!list) return;
  try{
    const d=await api('/api/customer/orders'); const orders=d.items||[];
    state._allOrders=orders;
    drawOrderTabs(); drawOrders();
  }catch(e){ if(!list.children.length) list.innerHTML='<p class="muted">'+esc(e.message)+'</p>'; }
}

async function renderOrders(){
  if(!state.token){ state._afterLogin='orders'; go('account'); return; }
  view.innerHTML='';
  view.appendChild(backLink('Back to home',()=>go('home')));
  const head=document.createElement('div'); head.className='row'; head.innerHTML='<h1>My orders</h1><span class="sp"></span><span class="live"><span class="ld"></span>Live</span>'; view.appendChild(head);
  const rb=document.createElement('div'); rb.id='dueRefills'; view.appendChild(rb); showDueRefills();
  if(!state._orderTab) state._orderTab='all';
  const tabs=document.createElement('div'); tabs.id='orderTabs'; tabs.className='row'; tabs.style.cssText='gap:8px;flex-wrap:wrap;margin-top:12px'; view.appendChild(tabs);
  const list=document.createElement('div'); list.id='ordersList'; list.style.marginTop='12px'; list.innerHTML='<p class="muted">Loading…</p>'; view.appendChild(list);
  await loadOrdersList();
  if(state._pollTimer) clearInterval(state._pollTimer);0
  state._pollTimer=setInterval(()=>{
    if(state.view!=='orders'){ clearInterval(state._pollTimer); state._pollTimer=null; return; }
    const t=document.activeElement&&document.activeElement.tagName;
    if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return; // don't wipe an open rating box
    loadOrdersList();
  }, 12000);
}
async function cancelOrder(id){
  try{ await api('/api/customer/orders/'+id+'/cancel',{method:'POST'}); toast('Order cancelled',true); renderOrders(); }
  catch(e){ toast(e.message); }
}

/* ---------------- NOTIFICATIONS ---------------- */
function notifSeenAt(){ try{ return Number(localStorage.getItem('medmart_notif_seen')||0); }catch{ return 0; } }
function setNotifSeen(t){ try{ localStorage.setItem('medmart_notif_seen', String(t)); }catch{} }
function timeAgo(t){
  if(!t) return '';
  const s=Math.floor((Date.now()-new Date(t).getTime())/1000);
  if(s<60) return 'just now';
  const m=Math.floor(s/60); if(m<60) return m+' min ago';
  const h=Math.floor(m/60); if(h<24) return h+(h===1?' hr ago':' hrs ago');
  const d=Math.floor(h/24); return d+(d===1?' day ago':' days ago');
}
function orderNotif(o){
  const num=o.orderNumber, ph=(o.pharmacy&&o.pharmacy.name)?o.pharmacy.name:'';
  const map={
    placed:['🕒','Order '+num+' placed — waiting for the pharmacy to accept.'],
    accepted:['✅','Order '+num+' accepted'+(ph?' by '+ph:'')+'.'],
    ready:['📦','Order '+num+' is packed and ready.'],
    assigned:['🚚','Order '+num+' is out for delivery.'],
    out_for_delivery:['🚚','Order '+num+' is out for delivery — keep your OTP ready.'],
    delivered:['🎉','Order '+num+' delivered. Hope you feel better soon!'],
    rejected:['❌','Order '+num+' was rejected by the pharmacy.'],
    cancelled:['🚫','Order '+num+' was cancelled.'],
  };
  const m=map[o.status]||['🔔','Order '+num+' updated.'];
  if(o.kind==='prescription' && !(o.total>0) && o.status==='placed'){ m[0]='📄'; m[1]='Prescription order '+num+' received — the pharmacy will set the amount soon.'; }
  return { icon:m[0], text:m[1], time:o.updatedAt||o.createdAt };
}
async function loadNotifs(){
  if(!state.token){ state._notifs=[]; updateNotifBadge(); return; }
  try{
    const d=await api('/api/customer/orders'); const orders=d.items||[];
    state._notifs=orders.map(orderNotif).sort((a,b)=>new Date(b.time)-new Date(a.time));
  }catch{ }
  updateNotifBadge();
}
function updateNotifBadge(){
  const b=$('notifCount'); if(!b) return;
  const seen=notifSeenAt();
  const unread=(state._notifs||[]).filter(n=>new Date(n.time).getTime()>seen).length;
  if(unread>0){ b.textContent=unread>9?'9+':String(unread); b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}
function renderNotifPanel(){
  const p=$('notifPanel'); if(!p) return;
  if(!state.token){
    p.innerHTML='<div class="notif-item"><div class="sub">Sign in to see your order updates here.</div></div>';
    const r=document.createElement('div'); r.style.padding='8px';
    const b=document.createElement('button'); b.className='light small'; b.textContent='Sign in'; b.onclick=()=>{ $('notifPanel').classList.add('hidden'); go('account'); };
    r.appendChild(b); p.appendChild(r); return;
  }
  const ns=state._notifs||[];
  if(!ns.length){ p.innerHTML='<div class="notif-item"><div class="sub">No notifications yet. Your order updates will appear here.</div></div>'; return; }
  p.innerHTML='<div class="row" style="padding:6px 8px"><strong>Notifications</strong></div>'+ns.slice(0,15).map(n=>`
    <div class="notif-item"><div class="row" style="align-items:flex-start;gap:8px"><div style="font-size:18px">${n.icon}</div>
      <div class="sp"><div>${esc(n.text)}</div><div class="sub" style="margin-top:2px">${esc(timeAgo(n.time))}</div></div></div></div>`).join('');
}
async function toggleNotifPanel(){
  const p=$('notifPanel'); if(!p) return;
  if(!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  renderNotifPanel(); p.classList.remove('hidden');
  await loadNotifs(); renderNotifPanel();
  setNotifSeen(Date.now()); updateNotifBadge();
}

/* ---------------- wire up ---------------- */
$('brandBtn').onclick=()=>go('home');
$('notifBtn').onclick=(e)=>{ e.stopPropagation(); toggleNotifPanel(); };
document.addEventListener('click',(e)=>{ const w=document.querySelector('.notif-wrap'); const p=$('notifPanel'); if(p && !p.classList.contains('hidden') && w && !w.contains(e.target)) p.classList.add('hidden'); });
$('cartBtn').onclick=()=>go('cart');
$('accountBtn').onclick=()=>go('account');
$('globalSearch').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const q=e.target.value.trim(); state._searchQ=q; go('search',q); } });
$('scanBtn').onclick=scanPhoto;
$('micBtn').onclick=voiceSearch;

(async function boot(){
  updateCartCount();
  if(state.token){ try{ const me=await api('/api/auth/me'); if(me.user.role==='customer') state.user=me.user; else { state.token=''; localStorage.removeItem('cust_token'); } }catch{ state.token=''; localStorage.removeItem('cust_token'); } }
  loadNotifs();
  setInterval(loadNotifs, 60000);
  go('home');
})();
</script>
